name: NEXUS AI CI & Security Verification Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Backend & Security Acceptance Suite
        env:
          PYTHONPATH: services/api:packages
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
      - name: Execute Reproducible RAG & Agent Benchmark Suite
        env:
          PYTHONPATH: services/api:packages
        run: python3 scripts/run_benchmarks.py
